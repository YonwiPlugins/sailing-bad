plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.yonwiplugins.sailingbad.SailingBadPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'com.yonwiplugins.sailingbad'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs += ['-Xlint:deprecation']
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

def jagexCredentials = new File(System.getProperty('user.home'), '.runelite/credentials.properties')
def jagexCredentialsBackup = new File(jagexCredentials.parentFile, 'credentials.properties.sailing-bad-backup')
def jagexEnvironmentKeys = [
	'JX_ACCESS_TOKEN',
	'JX_REFRESH_TOKEN',
	'JX_SESSION_ID',
	'JX_CHARACTER_ID',
	'JX_DISPLAY_NAME'
]

tasks.register('prepareManualLogin') {
	doLast {
		if (jagexCredentialsBackup.exists()) {
			throw new GradleException("A credentials backup already exists at ${jagexCredentialsBackup}. Run restoreManualLogin first.")
		}

		if (jagexCredentials.exists()) {
			java.nio.file.Files.move(jagexCredentials.toPath(), jagexCredentialsBackup.toPath())
			logger.lifecycle('Temporarily moved Jagex Launcher credentials out of RuneLite.')
		}
	}
}

tasks.register('restoreManualLogin') {
	doLast {
		if (!jagexCredentialsBackup.exists()) {
			return
		}

		if (jagexCredentials.exists()) {
			throw new GradleException("RuneLite created new credentials; backup retained at ${jagexCredentialsBackup} instead of overwriting them.")
		}

		java.nio.file.Files.move(jagexCredentialsBackup.toPath(), jagexCredentials.toPath())
		logger.lifecycle('Restored Jagex Launcher credentials.')
	}
}

tasks.register('runManualLogin', JavaExec) {
	dependsOn tasks.named('prepareManualLogin')
	finalizedBy tasks.named('restoreManualLogin')

	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass
	jvmArgs '-ea'
	args '--developer-mode', '--debug'

	doFirst {
		jagexEnvironmentKeys.each { environment.remove(it) }
	}
}

tasks.register('previewTotalTile', JavaExec) {
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.yonwiplugins.sailingbad.TotalTilePreview'
	args layout.buildDirectory.file('previews/total-tile.png').get().asFile.absolutePath
	if (project.hasProperty('previewSource')) {
		args project.property('previewSource')
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
